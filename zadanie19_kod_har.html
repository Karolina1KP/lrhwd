 </head>

 <script type="text/javascript"> 
  function pole_haratym() 
   { 
 var a_har= parseFloat(document.getElementById('dlugosc').value); 
 var b_har= a_har*a_har; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_har.toFixed(2)+" cm^2";  
   } 
  function obwod_haratym() 
   { 
 var a_har= parseFloat(document.getElementById('dlugosc').value); 
 var b_har= 4*a_har; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_har.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_haratym()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_haratym()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body>
