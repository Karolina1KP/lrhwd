<!DOCTYPE html>   
<head>       
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var x1_har=prompt("x1=",""); 
var x2_har=prompt("x2=",""); 

x1_har_rad=(Math.PI*x1_har)/180;
x2_har_rad=(Math.PI*x2_har)/180;

y1_har=3*Math.pow(x1_har,(8/10));
y2_har=2*Math.cos(x1_har)+3*Math.sin(x1_har);
y3_har=Math.pow(Math.pow(x1_har,5)+2*Math.pow(x2_har,4),1/3)*Math.abs(x1_har-x2_har);

document.write("Wczytane liczby: &nbsp;&nbsp;&nbsp;&nbsp;x1="+x1_har+" &nbsp;&nbsp;&nbsp;&nbsp;x2="+x2_har+"<br>"); 
document.write("x1_r="+x1_har_rad+" &nbsp;&nbsp;&nbsp;&nbsp;x2_r="+x2_har_rad+"<br>");

document.write("y1="+y1_har+" <br>");
document.write("y2="+y2_har+" <br>");
document.write("y3="+y3_har+" <br>");

</script> 
</div> 
</body> 
</html>
