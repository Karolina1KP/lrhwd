<!DOCTYPE html>
<head>
<title> proste obliczenia</title>
<meta charset="utf-8">
</head>
<body>
<div style="color:red;font-size:50px;">
<script language="JavaScript">
var liczba1=prompt("A=","");
var A_har=parseFloat(liczba1);
var liczba2=prompt("B=","");
var B_har=parseFloat(liczba2)
var c;
var d;
var e;
var f;
var w;
c=A_har*A_har*A_har;
d=3*A_har*A_har*B_har;
e=3*A_har*B_har*B_har;
f=B_har*B_har*B_har;
w=c+d+e+f;

document.write("("+A_har+"+"+B_har+")^3="+A_har+"^3+3*(("+A_har+")^2)*("+B_har+")+3*("+A_har+")*(("+B_har+")^2)+"+B_har+"^3="+c+"+"+d+"+"+e+"+"+f+"="+w+" ");
</script>
</div>
</body>
</html>
