<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_har(a, b) 
function odejmowanie_har(a, b)
function mnozenie_har(a, b)
function do_kwadratu_har(a, b) { 
return a + b; 
} 
document.write("suma="+suma_har(a,b)+"<br>"); 
document.write("odejmowanie="+odejmowanie_har(a,b)+"<br>");
document.write("mnozenie="+mnozenie_har(a,b)+"<br>");
document.write("do kwadratu="+do_kwadratu_har(a,b)+"<br>");
</script> 
</div> 
</body> 
</html>
